[package]
name = "mitos"
version = "0.1.0"
edition = "2024"
description = "A session-aware handoff layer for native coding-agent harnesses"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
crossterm = "0.29"
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
signal-hook = "0.4"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
toml = "1.1"
ureq = { version = "3", default-features = false }
uuid = { version = "1.16", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "poll"] }
